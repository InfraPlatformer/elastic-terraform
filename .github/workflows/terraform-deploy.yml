name: Terraform Infrastructure Pipeline

on:
  push:
    branches: [main, develop, feature/*]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'development'
        type: choice
        options:
        - development
        - staging
        - production

env:
  TF_VERSION: "1.5.0"
  AWS_REGION: "us-east-1"

jobs:
  # Security and Code Quality Checks
  security-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'

  # Terraform Validation and Security
  terraform-validate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: ${{ env.TF_VERSION }}
        
    - name: Check Terraform files
      run: |
        echo "Checking Terraform configuration files..."
        if [ -f "main.tf" ]; then
          echo "✅ main.tf found"
        else
          echo "⚠️ main.tf not found"
        fi
        
        if [ -f "variables.tf" ]; then
          echo "✅ variables.tf found"
        else
          echo "⚠️ variables.tf not found"
        fi
        
        if [ -f "outputs.tf" ]; then
          echo "✅ outputs.tf found"
        else
          echo "⚠️ outputs.tf not found"
        fi
        
        echo "Terraform validation completed (files checked)"
      
    - name: Run TFSec
      uses: aquasecurity/tfsec-action@v1.0.0
      with:
        working_directory: .
        
    - name: Run Checkov
      uses: bridgecrewio/checkov-action@master
      with:
        directory: .
        framework: terraform
        output_format: sarif
        output_file_path: checkov-results.sarif
        
    - name: Upload Checkov results
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'checkov-results.sarif'

  # Helm Chart Validation
  helm-validate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Helm
      uses: azure/setup-helm@v3
      with:
        version: 'v3.12.0'
        
    - name: Check Helm values files
      run: |
        echo "Checking Helm configuration files..."
        if [ -f "elasticsearch-values.yaml" ]; then
          echo "✅ elasticsearch-values.yaml found"
        else
          echo "⚠️ elasticsearch-values.yaml not found"
        fi
        
        if [ -f "kibana-values.yaml" ]; then
          echo "✅ kibana-values.yaml found"
        else
          echo "⚠️ kibana-values.yaml not found"
        fi
        
        echo "Helm validation completed (files checked)"

  # Code Quality Check
  code-quality:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Check file structure
      run: |
        echo "📁 Repository Structure Check:"
        echo "================================"
        
        # Check essential directories
        for dir in ".github" "environments" "modules" "docs"; do
          if [ -d "$dir" ]; then
            echo "✅ $dir/ directory found"
          else
            echo "⚠️ $dir/ directory not found"
          fi
        done
        
        echo ""
        echo "📄 Essential Files Check:"
        echo "========================="
        
        # Check essential files
        for file in "README.md" "LICENSE" "CONTRIBUTING.md" ".gitignore"; do
          if [ -f "$file" ]; then
            echo "✅ $file found"
          else
            echo "⚠️ $file not found"
          fi
        done
        
        echo ""
        echo "🔧 Configuration Files Check:"
        echo "=============================="
        
        # Check configuration files
        for file in "main.tf" "variables.tf" "outputs.tf" "elasticsearch-values.yaml" "kibana-values.yaml"; do
          if [ -f "$file" ]; then
            echo "✅ $file found"
          else
            echo "⚠️ $file not found"
          fi
        done

  # Summary and Status
  summary:
    runs-on: ubuntu-latest
    needs: [security-scan, terraform-validate, helm-validate, code-quality]
    if: always()
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Generate summary
      run: |
        echo "🎯 CI/CD Pipeline Summary"
        echo "========================"
        echo ""
        echo "Security Scan: ${{ needs.security-scan.result }}"
        echo "Terraform Validation: ${{ needs.terraform-validate.result }}"
        echo "Helm Validation: ${{ needs.helm-validate.result }}"
        echo "Code Quality: ${{ needs.code-quality.result }}"
        echo ""
        
        if [ "${{ needs.security-scan.result }}" == "success" ] && [ "${{ needs.terraform-validate.result }}" == "success" ] && [ "${{ needs.helm-validate.result }}" == "success" ] && [ "${{ needs.code-quality.result }}" == "success" ]; then
          echo "🎉 All checks passed! Repository is ready for deployment."
          echo ""
          echo "Next steps:"
          echo "1. Set up AWS credentials in GitHub secrets"
          echo "2. Configure environment-specific Terraform files"
          echo "3. Test deployment to development environment"
        else
          echo "⚠️ Some checks failed. Review the logs above for details."
          echo ""
          echo "Common issues:"
          echo "- Missing Terraform configuration files"
          echo "- Invalid Helm values files"
          echo "- Security scan failures"
        fi
